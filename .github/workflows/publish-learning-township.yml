name: Publish Learning Township — Free Origin and Premium
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'township-source/successlabs_township_31680_learning_pathways.csv'
      - 'scripts/generate_learning_township.py'
      - '.github/workflows/publish-learning-township.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove old generated township tree
        run: |
          git rm -r -q --ignore-unmatch -- 'Learning Township'
          rm -rf -- 'Learning Township'
      - name: Generate from authoritative HUB export
        run: python scripts/generate_learning_township.py
      - name: Verify all generated pathway documents
        run: |
          test "$(find 'Learning Township' -name README.md | wc -l)" -eq 45290
      - name: Verify 6336 LIT planning records
        run: |
          test "$(($(wc -l < 'Learning Township/07-LIT-Leadership-and-Identity-Transformation-Capability-Academy-Source-Sunday/lit-planned-pathways.csv') - 1))" -eq 6336
      - name: Verify 6336 free HUB Origin pathways
        run: |
          test "$(($(wc -l < 'Learning Township/hub-origin-free-pathways.csv') - 1))" -eq 6336
      - name: Commit generated Township
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Learning Township'
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish free Origin and premium Learning Township pathways"
            git push
          fi
